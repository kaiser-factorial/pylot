exercises:
  - id: py-basics/00-hello/01-multiply
    title: First computation
    kind: write-code
    difficulty: 1
    prompt: |
      Multiply 3 by 5 and store the result in a variable named `ans`.
      (Yes — this is MATLAB Onramp's Task 1, in its new home.)
    concepts: [variables, numbers]
    starter_code: |
      # your code here
    reference_solution: |
      ans = 3 * 5
    checks:
      - type: state
        expr: "ans == 15"
        message: "ans should hold 3 times 5"
    hints:
      - "Assignment looks like: name = expression"

  - id: py-basics/00-hello/02-hello-print
    title: Say it out loud
    kind: write-code
    difficulty: 1
    prompt: |
      Print exactly `Hello, Pylot!` using the print() function.
    concepts: [printing, strings, functions-calling]
    starter_code: |
      # your code here
    reference_solution: |
      print("Hello, Pylot!")
    checks:
      - type: stdout
        equals: "Hello, Pylot!"
      - type: ast
        requires: [Call]
        message: "use the print() function"
    hints:
      - "Strings can use single or double quotes."

  - id: py-basics/00-hello/03-predict-flow
    title: "Predict: top to bottom"
    kind: predict-output
    difficulty: 1
    prompt: |
      Python executes top to bottom, and a variable holds whatever it was
      assigned *last*. Read the code and predict the exact output.
    concepts: [execution-model, variables, printing]
    starter_code: |
      x = 10
      print(x)
      x = 20
      x = x + 5
      print(x)
    reference_solution: |
      x = 10
      print(x)
      x = 20
      x = x + 5
      print(x)
    checks:
      - type: stdout
        equals: |
          10
          25
    hints:
      - "The first print happens before x changes."
      - "`x = x + 5` reads the current value of x, adds 5, and rebinds x to the result."

  - id: py-basics/00-hello/04-fix-the-javascript
    title: "Fix: a JS speaker wrote this"
    kind: fix-bug
    difficulty: 1
    prompt: |
      This code was written by someone whose fingers still think in
      JavaScript. (For at least one learner, this is a verbatim line from
      their own attempt log. No further comment.) It should print `no` —
      the if/else is fine, but Python chokes on the very first line. Run it,
      read the error, fix it.
    concepts: [variables, errors-reading]
    starter_code: |
      let x = 1
      let y = 2

      if x == y:
          print("yes")
      else:
          print("no")
    reference_solution: |
      x = 1
      y = 2

      if x == y:
          print("yes")
      else:
          print("no")
    checks:
      - type: stdout
        equals: "no"
      - type: ast
        requires: [If, Compare]
        message: "keep the if/else structure — fix the declarations, don't replace the logic"
    hints:
      - "Python has no `let` — assignment alone declares the variable. There are two of them."
