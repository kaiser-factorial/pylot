exercises:
  - id: py-structure/00-modules-imports/01-import-math
    title: Use the standard library
    kind: write-code
    difficulty: 1
    prompt: |
      Import the `math` module and use it to print the square root of 144,
      then `math.pi` rounded to 2 decimals. Two lines. Expected: `12.0`
      then `3.14`.
    concepts: [modules-imports]
    starter_code: |
      # import math
    reference_solution: |
      import math
      print(math.sqrt(144))
      print(round(math.pi, 2))
    checks:
      - type: stdout
        equals: |
          12.0
          3.14
      - type: ast
        requires: [Import]
        message: "import the math module"
    hints:
      - "import math, then reach for math.sqrt(...) and math.pi."
      - "Wrap the pi value in round(math.pi, 2)."

  - id: py-structure/00-modules-imports/02-predict-from
    title: "Predict: the from-import"
    kind: predict-output
    difficulty: 2
    prompt: |
      `from math import ...` pulls names in directly — no `math.` prefix.
      Predict both printed lines.
    concepts: [modules-imports]
    starter_code: |
      from math import floor, ceil
      print(floor(7.8))
      print(ceil(7.2))
    reference_solution: |
      from math import floor, ceil
      print(floor(7.8))
      print(ceil(7.2))
    checks:
      - type: stdout
        equals: |
          7
          8
    hints:
      - "floor rounds DOWN to the nearest integer; ceil rounds UP."
      - "With from-import, you call floor(...) directly, no math. prefix."

  - id: py-structure/00-modules-imports/03-fix-import
    title: "Fix: the JavaScript import"
    kind: fix-bug
    difficulty: 2
    prompt: |
      This uses JavaScript import syntax, which Python rejects with a
      SyntaxError. Rewrite it as a proper Python `from ... import ...` so it
      prints the mean of the list. Expected: `20`.
    concepts: [modules-imports, errors-reading]
    starter_code: |
      import { mean } from statistics
      print(mean([10, 20, 30]))
    reference_solution: |
      from statistics import mean
      print(mean([10, 20, 30]))
    checks:
      - type: stdout
        equals: "20"
      - type: ast
        requires: [ImportFrom]
    hints:
      - "Python's form is: from statistics import mean — no braces, module name after `from`."
      - "The mean of 10, 20, 30 is 20."

  - id: py-structure/00-modules-imports/04-alias
    title: Import with an alias
    kind: write-code
    difficulty: 2
    prompt: |
      Import the `statistics` module under the alias `st` (the `import ... as
      ...` form you'll see everywhere as `np`/`pd`). Use it to print the
      median of `[3, 9, 4, 1, 8]`. Expected: `4`.
    concepts: [modules-imports]
    starter_code: |
      # import statistics as st
    reference_solution: |
      import statistics as st
      print(st.median([3, 9, 4, 1, 8]))
    checks:
      - type: stdout
        equals: "4"
      - type: ast
        requires: [Import]
    hints:
      - "import statistics as st, then call st.median(...)."
      - "The median of the sorted values 1, 3, 4, 8, 9 is the middle one, 4."
    # median returns int 4 for odd-length int lists (Python's statistics.median)
